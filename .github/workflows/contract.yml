# The SDK contract kit check (CTR-02): pull the digest-pinned private docql-stub
# image with this repo's own GITHUB_TOKEN and prove that the kit it serves over HTTP
# equals the vendored copy in contract/ (D-07). Since Phase 13 the workflow also runs
# the full shared SDK case list against the same pinned stub on JDK 17/21/25, gated on
# the vendored case count, the nine Java-only live checks and a clean failsafe report,
# plus the README quickstart (contract-cases), and it is reusable so release.yml runs
# it on a tag.
name: contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  contract-access:
    name: contract-access
    # Fork PRs skip the job, so a fork never gets the private image through a PR run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: served kit equals vendored kit (D-07)
        run: scripts/bump-stub.sh --verify

  contract-cases:
    name: contract-cases (${{ matrix.java }})
    # Same fork guard as contract-access: the pinned stub image is private.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: shared case list against the pinned stub
        run: |
          set -euo pipefail
          WANT=$(jq '[.cases[] | select(.via == "sdk" or .via == "raw")] | length' contract/sdk-cases.json)
          scripts/stub-up.sh --run env DOCQL_REQUIRE_STUB=1 ./mvnw -B -ntp verify | tee "$RUNNER_TEMP/contract.log"
          ran=$(grep -cE '^CONTRACT_CASE_OK (sdk|raw) ' "$RUNNER_TEMP/contract.log" || true)
          if [ "$ran" -ne "$WANT" ]; then
            echo "expected $WANT CONTRACT_CASE_OK lines (sdk|raw), saw $ran" >&2
            exit 1
          fi
          if ! grep -qx "CONTRACT_CASES_RAN $WANT" "$RUNNER_TEMP/contract.log"; then
            echo "the exact-count gate line CONTRACT_CASES_RAN $WANT is missing" >&2
            exit 1
          fi
          extras=$(grep -cE '^CONTRACT_EXTRA_OK [a-z0-9-]+$' "$RUNNER_TEMP/contract.log" || true)
          if [ "$extras" -ne 9 ]; then
            echo "expected 9 CONTRACT_EXTRA_OK lines (the Java-only live checks), saw $extras" >&2
            exit 1
          fi
          python3 -c "import sys, xml.etree.ElementTree as E; r = E.parse('target/failsafe-reports/TEST-com.finoniq.docql.ContractIT.xml').getroot(); assert r.get('failures') == '0' and r.get('errors') == '0' and r.get('skipped') == '0' and int(r.get('tests')) > 0, 'the ContractIT failsafe report must be clean'"
          echo "contract-cases: $ran/$WANT cases, extras ok"
      - name: README quickstart
        run: scripts/stub-up.sh --run scripts/run-readme.sh
